name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ─────────────────────────────────────────────────────────────────────────────
# Quality gate — runs on every push and every PR to main.
#
# Vercel's native GitHub integration owns the actual deployment:
#   • PR  → Vercel preview deployment (automatic)
#   • main push → Vercel production deployment (automatic)
#
# This workflow's only job is to block bad code from reaching main.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  quality:
    name: Type Check & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Prisma generate only needs a syntactically valid URL at this step;
          # it does not connect to the database.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
